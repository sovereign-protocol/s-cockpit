<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Overview</title>
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/apps/cockpit/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <!-- The shell owns the bar; "+ Add new…" is handed to its
         application-actions slot. -->
    <header class="bob-topbar"><div id="shell"></div></header>

    <template id="cockpitHeaderControls">
      <div class="bob-add-new">
        <button id="addNewBtn" class="ui-button" aria-haspopup="true">+ Add new…</button>
        <div id="addNewMenu" class="bob-add-menu" hidden></div>
      </div>
    </template>

    <main id="boards" class="bob-boards"></main>

    <div id="reactionMenu" class="reaction-menu" role="menu" hidden></div>

    <dialog id="cardModal">
      <form method="dialog" id="cardForm">
        <h2 id="cardModalTitle">Edit Card</h2>
        <div id="cardPerspectiveSwitcher" class="perspective-switcher"></div>
        <p id="cardPerspectiveMeta" class="perspective-meta"></p>
        <label>Name<input id="cardName" /></label>
        <label>Description<textarea id="cardDescription" rows="4"></textarea></label>
        <label>Owner<select id="cardOwner"></select></label>
        <label>Members</label>
        <div id="participantPicker" class="user-picker"></div>
        <menu>
          <button type="button" id="deleteCardBtn" class="danger">Delete</button>
          <button type="button" id="cancelCardBtn">Cancel</button>
          <button type="submit" id="saveCardBtn" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="boardSettingsModal">
      <div class="bob-manage">
        <h2 id="boardSettingsTitle">Initiative settings</h2>
        <div id="boardSettingsFields"></div>
        <menu>
          <button type="button" id="deleteBoardSettingsBtn" class="danger">Delete initiative</button>
          <button type="button" id="cancelBoardSettingsBtn">Cancel</button>
          <button type="button" id="saveBoardSettingsBtn" class="primary">Save</button>
        </menu>
      </div>
    </dialog>

    <dialog id="agreementSettingsModal">
      <div class="bob-manage">
        <h2 id="agreementSettingsTitle">Team settings</h2>
        <p class="bob-hint">
          A team has nothing to map onto bands the way an initiative does, so this is where deleting
          one lives.
        </p>
        <menu>
          <button type="button" id="deleteAgreementBtn" class="danger">Delete team</button>
          <button type="button" id="cancelAgreementSettingsBtn">Cancel</button>
        </menu>
      </div>
    </dialog>

    <dialog id="newBoardModal">
      <form method="dialog" id="newBoardForm">
        <h2>New Initiative</h2>
        <label>Name<input id="newBoardName" value="Untitled initiative" /></label>
        <label>Copy from (optional)<select id="newBoardTemplate"></select></label>
        <menu>
          <button type="button" id="cancelNewBoardBtn">Cancel</button>
          <button type="submit" class="primary">Create</button>
        </menu>
      </form>
    </dialog>

    <dialog id="newAgreementModal">
      <form method="dialog" id="newAgreementForm">
        <h2>New Team</h2>
        <label>Name<input id="newAgreementName" value="Untitled team" /></label>
        <label>Copy from (optional)<select id="newAgreementTemplate"></select></label>
        <menu>
          <button type="button" id="cancelNewAgreementBtn">Cancel</button>
          <button type="submit" class="primary">Create</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirmModal">
      <h2 id="confirmModalTitle">Action</h2>
      <p id="confirmModalMessage" class="confirm-text"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Confirm</button>
      </menu>
    </dialog>

    <script src="/shared-api.js"></script>
    <script src="/shared-session.js"></script>
    <script src="/shared.js"></script>
    <script>
      let state = null;
      let modalCard = null;
      let modalParticipants = [];
      let modalOwner = null;
      let modalPerspectiveKey = null;
      let modalPerspectiveOptions = [];
      let modalLocalDraft = null;
      let modalReadOnlyPerspective = false;
      let settingsBoard = null;
      let settingsAgreement = null;
      const AUTO_ADOPT_LABELS = {
        always: "Always",
        not_owner: "Except cards I own",
        not_member: "Except cards I'm on",
        never: "Never",
      };
      const AUTO_ADOPT_DESCRIPTIONS = {
        always: "Peer changes are automatically adopted into every card.",
        not_owner: "Peer changes are automatically adopted, except on cards you own.",
        not_member: "Peer changes are automatically adopted, except on cards you're a member of.",
        never: "Peer changes wait for you to review and adopt them.",
      };
      const APP_ICONS = {
        kanban:
          '<rect x="4" y="4" width="4" height="16" rx="1"></rect>' +
          '<rect x="10" y="4" width="4" height="11" rx="1"></rect>' +
          '<rect x="16" y="4" width="4" height="7" rx="1"></rect>',
        team:
          '<path d="M6 3h8l4 4v14H6z"></path>' +
          '<path d="M14 3v4h4"></path><path d="M9 13h6"></path>' +
          '<path d="M9 17h6"></path>',
        flow:
          '<path d="M5 4h14v16H5z"></path>' +
          '<path d="M8 9l2 2 5-5"></path>' +
          '<path d="M8 15h8"></path>',
      };
      const el = (id) => document.getElementById(id);

      const api = SovereignApi.request;
      const sessionView = SovereignSessionView.create({ request: api });
      sessionView
        .defineView("tiles", {
          load: () => api("/api/cockpit/tiles"),
        })
        .defineView("context", {
          load: () => api("/api/cockpit/context"),
        });
      sessionView.subscribe((nextState, _pending, event) => {
        state = nextState;
        if (!Array.isArray(state.boards)) return;
        if (event.change === "state" || event.change === "tiles") {
          render();
        }
        if (event.change !== "pending") {
          renderSelectedTopic();
          SovereignShell.refresh();
        }
      });

      function mutationRequest(context, path, body = {}, suffix = "") {
        const mutationId = suffix ? `${context.mutationId}:${suffix}` : context.mutationId;
        return api(
          path,
          { ...body, mutation_id: mutationId },
          {
            signal: context.signal,
          },
        );
      }

      function run(action, successMessage) {
        const promise = sessionView.mutate({
          key: `action:${Date.now()}:${Math.random()}`,
          command: "application-action",
          action: (context) =>
            action((path, body, suffix) => mutationRequest(context, path, body, suffix)),
          invalidates: ["tiles", "context"],
        });
        promise
          .then(() => showToast(successMessage))
          .catch((error) => showToast(error.message, true));
        return promise;
      }

      function submitMutation({ key, command, arguments: args, action, project, successMessage }) {
        const promise = sessionView.mutate({
          key,
          command,
          arguments: args,
          project,
          action: (context) =>
            action((path, body, suffix) => mutationRequest(context, path, body, suffix)),
          invalidates: ["tiles", "context"],
        });
        promise
          .then(() => showToast(successMessage))
          .catch((error) => showToast(error.message, true));
        return promise;
      }

      async function load() {
        await sessionView.refresh(["tiles", "context"]);
      }

      function render() {
        const container = el("boards");
        container.replaceChildren();
        const agreements = state.agreements || [];
        const processes = state.processes || [];
        if (!state.boards.length && !agreements.length && !processes.length) {
          const empty = document.createElement("p");
          empty.className = "bob-empty";
          empty.textContent = "Nothing yet - use “+ Add new”.";
          container.append(empty);
          renderSelectedTopic();
          SovereignShell.refresh();
          return;
        }
        const tiles = tilesInDisplayOrder();
        const expanded = tiles.filter((tile) => tile.expanded);
        const collapsed = tiles.filter((tile) => !tile.expanded);
        expanded.forEach((tile, index) => {
          container.append(
            tile.application_id === "team"
              ? renderExpandedAgreement(tile, index, expanded.length)
              : tile.application_id === "flow"
                ? renderFlowTile(tile, index, expanded.length)
                : renderExpandedBoard(tile, index, expanded.length),
          );
        });
        chunk(collapsed, 5).forEach((group, chunkIndex) => {
          const lane = document.createElement("section");
          lane.className = "bob-collapsed-lane";
          group.forEach((tile, i) =>
            lane.append(
              tile.application_id === "team"
                ? renderAgreementTile(tile, chunkIndex * 5 + i, collapsed.length)
                : tile.application_id === "flow"
                  ? renderFlowTile(tile, chunkIndex * 5 + i, collapsed.length)
                  : renderCollapsedBoard(tile, chunkIndex * 5 + i, collapsed.length),
            ),
          );
          container.append(lane);
        });
        renderSelectedTopic();
        SovereignShell.refresh();
      }

      function renderSelectedTopic() {
        const topic = state.selected_topic;
        if (!topic) {
          SovereignShell.setTopicRegion(null);
          return;
        }
        const link = document.createElement("a");
        link.className = "shell-topic-name";
        link.textContent = topic.title;
        link.href =
          topic.application_id === "team"
            ? `/apps/team?agreement=${encodeURIComponent(topic.uuid)}`
            : topic.application_id === "flow"
              ? `/apps/flow?process_uuid=${encodeURIComponent(topic.uuid)}`
              : `/apps/initiative?board=${encodeURIComponent(topic.uuid)}`;
        SovereignShell.setTopicRegion(link);
      }

      function selectTopic(topic) {
        if (state.selected_topic?.uuid === topic.uuid) return;
        const selected = {
          uuid: topic.uuid,
          title: topic.title || topic.name || "",
          application_id: topic.application_id,
        };
        return submitMutation({
          key: "selected-topic",
          command: "select-topic",
          arguments: selected,
          action: (request) =>
            request("/api/cockpit/topics/select", {
              topic_uuid: topic.uuid,
            }),
          successMessage: `${topic.title || topic.name} selected`,
          project: (draft, nextTopic) => {
            draft.selected_topic = nextTopic;
            for (const entry of [
              ...(draft.boards || []),
              ...(draft.agreements || []),
              ...(draft.processes || []),
            ]) {
              entry.selected_topic = entry.uuid === nextTopic.uuid;
            }
            draft.agenda_items = [];
            draft.transition_events = [];
            draft.transition_by_node = {};
            return draft;
          },
        });
      }

      function makeTopicSelectable(element, topic) {
        if (topic.selected_topic) element.classList.add("selected-topic");
        element.onclick = (event) => {
          if (event.target.closest("a, button, input, select, textarea")) return;
          selectTopic(topic);
        };
      }

      function tilesInDisplayOrder() {
        const order = new Map((state.tile_order || []).map((uuid, index) => [uuid, index]));
        return [
          ...(state.boards || []),
          ...(state.agreements || []),
          ...(state.processes || []),
        ].sort(
          (left, right) =>
            (order.get(left.uuid) ?? Number.MAX_SAFE_INTEGER) -
              (order.get(right.uuid) ?? Number.MAX_SAFE_INTEGER) ||
            String(left.name || left.title || "").localeCompare(
              String(right.name || right.title || ""),
            ),
        );
      }

      function topicTitle(applicationId, text, href) {
        const title = document.createElement("a");
        title.className = "bob-board-title";
        title.href = href;
        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("aria-hidden", "true");
        icon.classList.add("bob-topic-icon");
        icon.innerHTML = APP_ICONS[applicationId] || "";
        const label = document.createElement("span");
        label.textContent = text;
        title.append(icon, label);
        return title;
      }

      function renderAgreementTile(agreement, index, total) {
        const tile = document.createElement("section");
        tile.className = "bob-board collapsed bob-agreement-tile";
        makeTopicSelectable(tile, agreement);
        tile.append(agreementHeader(agreement, index, total));
        return tile;
      }

      function renderFlowTile(process, index, total) {
        const tile = document.createElement("section");
        tile.className = "bob-board collapsed bob-flow-tile";
        makeTopicSelectable(tile, process);

        const header = document.createElement("div");
        header.className = "bob-board-header";
        const main = document.createElement("div");
        main.className = "bob-board-main";
        main.append(
          topicTitle(
            "flow",
            process.title || "Untitled flow",
            `/apps/flow?process_uuid=${encodeURIComponent(process.uuid)}`,
          ),
        );
        const stage = document.createElement("p");
        stage.className = "bob-flow-stage";
        stage.textContent = process.current_stage
          ? `Now: ${process.current_stage}`
          : process.lifecycle;
        const required = document.createElement("p");
        required.className = "bob-flow-required";
        required.textContent = process.required_from_me || "Wait";
        main.append(stage, required);
        header.append(main);

        const tools = document.createElement("div");
        tools.className = "bob-board-tools";
        const controls = document.createElement("div");
        controls.className = "bob-board-controls";
        controls.append(moveButton("<", index === 0, () => moveTile(process, -1)));
        controls.append(moveButton(">", index >= total - 1, () => moveTile(process, 1)));
        controls.append(iconButton(ICON_SHARE, "Share", () => openShareModal(process)));
        const status = document.createElement("div");
        status.className = "bob-board-status";
        status.append(
          statItem(process.assignment_count, "people"),
          statItem(process.agenda_count, "agenda"),
        );
        tools.append(controls, status);
        header.append(tools);
        tile.append(header);
        return tile;
      }

      function renderExpandedAgreement(agreement, index, total) {
        const panel = document.createElement("section");
        panel.className = "bob-board expanded bob-agreement-tile";
        makeTopicSelectable(panel, agreement);
        panel.append(agreementHeader(agreement, index, total));
        // A team is three parts, and the enlarged tile shows all of them in
        // the order they are agreed: what was agreed, who is in it, and what
        // they hold.
        panel.append(
          teamPart("Agreement", agreementDocument(agreement)),
          teamPart("Actors", agreementActors(agreement)),
          teamPart("Roles", agreementRoles(agreement)),
        );
        return panel;
      }

      // The same header a board gets: move, enlarge/collapse, share,
      // settings, and the counts underneath. The two topic kinds differ in
      // what enlarging shows, not in what a tile offers.
      function agreementHeader(agreement, index, total) {
        const header = document.createElement("div");
        header.className = "bob-board-header";
        const main = document.createElement("div");
        main.className = "bob-board-main";
        const title = topicTitle(
          "team",
          agreement.title || "Untitled team",
          `/apps/team?agreement=${encodeURIComponent(agreement.uuid)}`,
        );
        main.append(title);
        header.append(main);
        const tools = document.createElement("div");
        tools.className = "bob-board-tools";
        const controls = document.createElement("div");
        controls.className = "bob-board-controls";
        controls.append(moveButton("<", index === 0, () => moveTile(agreement, -1)));
        controls.append(moveButton(">", index >= total - 1, () => moveTile(agreement, 1)));
        if (agreement.expanded) {
          controls.append(
            iconButton(ICON_COLLAPSE, "Collapse", () => setAgreementExpanded(agreement, false)),
          );
        } else {
          controls.append(
            iconButton(ICON_EXPAND, "Enlarge", () => setAgreementExpanded(agreement, true)),
          );
        }
        controls.append(iconButton(ICON_SHARE, "Share", () => openShareModal(agreement)));
        controls.append(
          iconButton(ICON_SETTINGS, "Settings", () => openAgreementSettings(agreement)),
        );
        tools.append(controls, agreementStatus(agreement));
        header.append(tools);
        return header;
      }

      function agreementStatus(agreement) {
        const status = document.createElement("div");
        status.className = "bob-board-status";
        status.append(
          divergenceItem(agreement.unsettled_count),
          statItem(agreement.agenda_count, "agenda"),
        );
        return status;
      }

      // One part of a team - its name, and the box that shows it. The three
      // parts share a shape so the tile reads as one thing rather than three.
      function teamPart(label, body) {
        const part = document.createElement("div");
        part.className = `bob-team-part bob-team-part-${label.toLowerCase()}`;
        const heading = document.createElement("h3");
        heading.className = "bob-team-part-label";
        heading.textContent = label;
        part.append(heading, body);
        return part;
      }

      // Loading and empty are different facts, and a part that is still
      // arriving must not claim there is nothing in it.
      function teamPartHint(agreement, emptyText) {
        const hint = document.createElement("p");
        hint.className = "bob-hint";
        hint.textContent = agreement.optimistic_loading
          ? "Loading team..."
          : emptyText;
        return hint;
      }

      function agreementDocument(agreement) {
        // Read-only: the tile shows the agreement, the team application
        // is where it is edited. The title above already links there.
        const wrap = document.createElement("div");
        wrap.className = "bob-agreement-document";
        const sections = agreement.sections || [];
        if (!sections.length) {
          wrap.append(
            teamPartHint(agreement, "Nothing has been agreed yet."),
          );
          return wrap;
        }
        for (const section of sections) {
          const heading = document.createElement("h3");
          heading.textContent = section.title || "Untitled section";
          wrap.append(heading);
          for (const clause of section.clauses || []) {
            const line = document.createElement("p");
            line.className = "bob-agreement-clause";
            line.textContent = clause.text || "";
            wrap.append(line);
          }
        }
        return wrap;
      }

      // Who is in the team, and what each of them holds. Only settled
      // holdings are named: an offer still being answered belongs in the
      // team application, where it can be answered.
      function agreementActors(agreement) {
        const wrap = document.createElement("div");
        wrap.className = "bob-agreement-document bob-team-list";
        const actors = agreement.actors || [];
        if (!actors.length) {
          wrap.append(teamPartHint(agreement, "Nobody has joined yet."));
          return wrap;
        }
        for (const actor of actors) {
          wrap.append(
            teamRow(
              actor.name || "Unknown actor",
              actor.roles?.length ? actor.roles.join(", ") : "Observer",
              SovereignUI.avatar(actor, {
                className: "participant-avatar",
                self: actor.is_self,
                title: actor.name || "Unknown actor",
              }),
            ),
          );
        }
        return wrap;
      }

      function agreementRoles(agreement) {
        const wrap = document.createElement("div");
        wrap.className = "bob-agreement-document bob-team-list";
        const roles = agreement.roles || [];
        if (!roles.length) {
          wrap.append(teamPartHint(agreement, "No roles yet."));
          return wrap;
        }
        for (const role of roles) {
          wrap.append(
            teamRow(
              role.name || "Untitled role",
              role.holders?.length ? role.holders.join(", ") : "Unheld",
            ),
          );
        }
        return wrap;
      }

      function teamRow(name, detail, avatar) {
        const row = document.createElement("div");
        row.className = "bob-team-row";
        if (avatar) row.append(avatar);
        const label = document.createElement("span");
        label.className = "bob-team-name";
        label.textContent = name;
        const meta = document.createElement("span");
        meta.className = "bob-team-detail";
        meta.textContent = detail;
        row.append(label, meta);
        return row;
      }

      function setAgreementExpanded(agreement, expanded) {
        return submitMutation({
          key: `expanded:${agreement.uuid}`,
          command: "set-agreement-expanded",
          arguments: { uuid: agreement.uuid, expanded },
          action: (request) =>
            request("/api/cockpit/agreements/settings", {
              agreement_uuid: agreement.uuid,
              expanded,
            }),
          successMessage: expanded ? "Enlarged" : "Collapsed",
          project: (draft, change) => {
            const target = (draft.agreements || []).find((entry) => entry.uuid === change.uuid);
            if (target) {
              target.expanded = change.expanded;
              target.optimistic_loading = change.expanded && !(target.sections || []).length;
            }
            return draft;
          },
        });
      }

      function moveTile(tile, direction) {
        const tiles = tilesInDisplayOrder();
        const group = tiles.filter((entry) => Boolean(entry.expanded) === Boolean(tile.expanded));
        const order = group.map((entry) => entry.uuid);
        const index = order.indexOf(tile.uuid);
        const swapWith = index + direction;
        if (swapWith < 0 || swapWith >= order.length) return;
        [order[index], order[swapWith]] = [order[swapWith], order[index]];
        const other = tiles
          .filter((entry) => Boolean(entry.expanded) !== Boolean(tile.expanded))
          .map((entry) => entry.uuid);
        const fullOrder = tile.expanded ? [...order, ...other] : [...other, ...order];
        submitMutation({
          key: "tile-order",
          command: "reorder-tiles",
          arguments: { tileOrder: fullOrder },
          action: (request) =>
            request("/api/cockpit/tiles/reorder", {
              tile_uuids: fullOrder,
            }),
          successMessage: "Reordered",
          project: (draft, change) => {
            draft.tile_order = [...change.tileOrder];
            return draft;
          },
        });
      }

      function renderExpandedBoard(board, index, total) {
        const panel = document.createElement("section");
        panel.className = "bob-board expanded";
        makeTopicSelectable(panel, board);
        panel.append(boardHeader(board, true, index, total));
        panel.append(renderBand("Active", board, board.active_cards));
        panel.append(renderBand("Next", board, board.next_cards));
        return panel;
      }

      function renderCollapsedBoard(board, index, total) {
        const tile = document.createElement("section");
        tile.className = "bob-board collapsed";
        makeTopicSelectable(tile, board);
        tile.append(boardHeader(board, false, index, total));
        return tile;
      }

      function boardHeader(board, expanded, index = 0, total = 1) {
        const header = document.createElement("div");
        header.className = "bob-board-header";
        const main = document.createElement("div");
        main.className = "bob-board-main";
        const title = topicTitle(
          "kanban",
          board.name,
          `/apps/initiative?board=${encodeURIComponent(board.uuid)}`,
        );
        main.append(title, objectiveElement(board));
        header.append(main);
        const tools = document.createElement("div");
        tools.className = "bob-board-tools";
        const controls = document.createElement("div");
        controls.className = "bob-board-controls";
        controls.append(moveButton("<", index === 0, () => moveTile(board, -1)));
        controls.append(moveButton(">", index >= total - 1, () => moveTile(board, 1)));
        if (expanded) {
          controls.append(iconButton(ICON_COLLAPSE, "Collapse", () => setExpanded(board, false)));
        } else {
          controls.append(iconButton(ICON_EXPAND, "Expand", () => setExpanded(board, true)));
        }
        controls.append(iconButton(ICON_SHARE, "Share", () => openShareModal(board)));
        controls.append(iconButton(ICON_SETTINGS, "Settings", () => openBoardSettings(board)));
        tools.append(controls, boardStatus(board));
        header.append(tools);
        return header;
      }

      function chunk(items, size) {
        const groups = [];
        for (let index = 0; index < items.length; index += size) {
          groups.push(items.slice(index, index + size));
        }
        return groups;
      }

      function moveButton(text, disabled, action) {
        const button = smallButton(text, action);
        button.classList.add("bob-move");
        button.disabled = disabled;
        return button;
      }

      function smallButton(text, action) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bob-small-btn";
        button.textContent = text;
        button.onclick = action;
        return button;
      }

      function objectiveElement(board) {
        // A fixed-height 2-line box, bottom-aligned: short objectives sit
        // low (away from the title above), longer ones fill both lines and
        // reach up near the title. Line-clamp+ellipsis only applies while
        // not focused, so editing still shows the full text being typed.
        const wrap = document.createElement("div");
        wrap.className = "bob-objective-wrap";
        const div = document.createElement("div");
        div.className = "bob-objective";
        div.contentEditable = "true";
        div.textContent = board.objective || "";
        div.title = board.objective || "";
        div.onkeydown = (event) => {
          if (event.key === "Enter") event.preventDefault();
        };
        div.onblur = () => {
          const value = div.textContent.trim();
          div.title = value;
          run(
            (request) =>
              request("/api/cockpit/kanban/boards/set_objective", {
                board_uuid: board.uuid,
                objective: value,
              }),
            "Objective updated",
          );
        };
        wrap.append(div);
        return wrap;
      }

      function boardStatus(board) {
        const status = document.createElement("div");
        status.className = "bob-board-status";
        status.append(
          divergenceItem(board.discussion_count),
          statItem(board.agenda_count, "agenda"),
        );
        return status;
      }

      function statItem(value, label) {
        const item = document.createElement("span");
        item.className = "bob-stat";
        item.textContent = `${value} ${label}`;
        return item;
      }

      // The count both topic kinds lead with, and the only one that is
      // coloured - an unresolved difference is the thing worth noticing.
      function divergenceItem(count) {
        const item = statItem(count || 0, count === 1 ? "divergence" : "divergences");
        if (count > 0) item.classList.add("bob-stat-divergence");
        return item;
      }

      function renderBand(label, board, cards) {
        const wrap = document.createElement("div");
        wrap.className = "bob-band";
        const heading = document.createElement("h3");
        const title = document.createElement("span");
        title.textContent = label;
        const count = document.createElement("span");
        count.className = "bob-band-count";
        count.textContent = cards.length;
        const sources = document.createElement("span");
        sources.className = "bob-band-sources";
        sources.textContent = `(${bandColumnNames(board, label).join(", ") || "not set"})`;
        heading.append(title, count, sources);
        wrap.append(heading);
        const list = document.createElement("div");
        list.className = "bob-card-list";
        let lastRelevance = null;
        for (const card of cards) {
          if (lastRelevance === "owner" && card.relevance === "participant") {
            const divider = document.createElement("div");
            divider.className = "bob-relevance-divider";
            list.append(divider);
          }
          list.append(renderCard(board, card, label));
          lastRelevance = card.relevance;
        }
        wrap.append(list);
        return wrap;
      }

      function bandColumnNames(board, label) {
        const sourceUuids =
          label === "Active" ? board.active_column_uuids : board.next_column_uuids;
        const columnsByUuid = new Map(board.columns.map((column) => [column.uuid, column.name]));
        return sourceUuids.map((uuid) => columnsByUuid.get(uuid)).filter(Boolean);
      }

      function renderCard(board, card, band) {
        const row = document.createElement("div");
        row.className = "bob-card" + (card.selected ? " selected" : "");
        applyCardTransition(row, card);

        const body = document.createElement("div");
        body.className = "bob-card-body";
        const name = document.createElement("button");
        name.type = "button";
        name.className = "bob-card-name";
        name.textContent = card.name;
        name.title = "Click to edit";
        name.onclick = () => openCardModal(card);
        body.append(name);
        const description = document.createElement("p");
        description.className = "bob-card-description";
        description.textContent = card.description || "";
        body.append(description);
        row.append(body);
        row.append(cardDiscussionTools(card));
        row.append(cardPeople(card));

        const select = document.createElement("select");
        select.className = "bob-status-select";
        for (const column of board.columns) {
          const opt = document.createElement("option");
          opt.value = column.uuid;
          opt.textContent = column.name;
          select.append(opt);
        }
        if (band === "Active") {
          const opt = document.createElement("option");
          opt.value = "__selected__";
          opt.textContent = "Selected";
          select.append(opt);
        }
        select.value = card.column_uuid;
        select.onchange = () => {
          const value = select.value;
          if (value === "__selected__") {
            run(
              (request) =>
                request("/api/cockpit/cards/toggle_selected", { card_uuid: card.uuid }),
              "Updated",
            );
            return;
          }
          run(
            (request) =>
              request("/api/cockpit/kanban/cards/move", {
                card_uuid: card.uuid,
                column_uuid: value,
                index: 0,
              }),
            "Moved",
          );
        };
        row.append(select);
        return row;
      }

      function applyCardTransition(row, card) {
        const info = card.transition;
        if (!info || info.stage === "settled") return;
        row.classList.add("diff", `stage-${info.stage}`);
        row.title = transitionLabel(info);
      }

      function cardDiscussionTools(card) {
        const wrap = document.createElement("div");
        wrap.className = "bob-card-discussion-tools";
        const info = card.transition;
        if (!info || ["settled", "in_flight"].includes(info.stage)) return wrap;
        wrap.append(reactionButton(card));
        return wrap;
      }

      function reactionButton(card) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bob-react";
        button.setAttribute("aria-label", "React to differences");
        button.title = transitionLabel(card.transition);
        button.textContent = "React";
        const events = (card.transition?.events || [card.transition]).filter(
          (event) => event && event.type !== "in_agreement",
        );
        const reactions = events.map((event) => ({
          // Same wording as Kanban, from Core: named for the act, from the
          // side being offered the choice.
          label: transitionReactionLabel(event),
          action: event.reaction || "adopt",
          event,
        }));
        button.onclick = (event) => {
          event.stopPropagation();
          openReactionMenu(button, card, reactions);
        };
        return button;
      }

      function closeReactionMenu() {
        const menu = el("reactionMenu");
        menu.hidden = true;
        menu.replaceChildren();
      }

      function openReactionMenu(anchor, card, reactions) {
        if (!reactions.length) return;
        const menu = el("reactionMenu");
        menu.replaceChildren();
        for (const reaction of reactions) {
          const option = document.createElement("button");
          option.type = "button";
          option.className = "reaction-menu-option";
          option.textContent = reaction.label;
          option.onclick = async (event) => {
            event.stopPropagation();
            closeReactionMenu();
            const missing = reaction.event.type === "peer_missing_node";
            const endpoint =
              reaction.action === "rollback"
                ? "/api/cockpit/kanban/rollback"
                : "/api/cockpit/kanban/adopt";
            await run(
              (request) =>
                request(endpoint, {
                  source_addr: reaction.event.peer_addr,
                  node_uuid: card.uuid,
                  adopt_absence: reaction.action === "adopt" && missing,
                  rollback_absence: reaction.action === "rollback" && missing,
                }),
              reaction.action === "rollback" ? "Rolled back" : "Adopted",
            );
          };
          menu.append(option);
        }
        menu.hidden = false;
        const rect = anchor.getBoundingClientRect();
        const margin = 8;
        const left = Math.max(
          margin,
          Math.min(rect.left, window.innerWidth - menu.offsetWidth - margin),
        );
        let top = rect.bottom + 4;
        if (top + menu.offsetHeight > window.innerHeight - margin) {
          top = Math.max(margin, rect.top - menu.offsetHeight - 4);
        }
        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
      }

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#reactionMenu")) closeReactionMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeReactionMenu();
      });
      window.addEventListener("resize", closeReactionMenu);
      window.addEventListener("scroll", closeReactionMenu, true);

      function peerLabel(address) {
        const user = (state.users || []).find((item) => item.address === address);
        if (user?.name && user.name !== "?") return user.name;
        const text = String(address || "");
        const match = text.match(/:(\d+)(?:\/)?$/);
        return match ? match[1] : text.replace(/^https?:\/\//, "") || "peer";
      }

      function userForParticipant(participant) {
        return (
          (state.users || []).find((user) =>
            [user.id, user.profile_uuid, user.identity_key, user.address].includes(participant),
          ) || { name: "?" }
        );
      }

      function cardPeople(card) {
        const wrap = document.createElement("div");
        wrap.className = "bob-card-people";
        const owner = card.owner_person || null;
        if (owner) wrap.append(personAvatar(owner, true));
        for (const participant of card.participant_people || []) {
          if (owner && participant.id === owner.id) continue;
          wrap.append(personAvatar(participant, false));
        }
        if (!wrap.childElementCount) {
          const empty = document.createElement("span");
          empty.className = "bob-card-people-empty";
          empty.textContent = "-";
          empty.title = "Owner: None; Participants: None";
          wrap.append(empty);
        }
        return wrap;
      }

      function personAvatar(person, owner) {
        return SovereignUI.avatar(person, {
          className: "participant-avatar",
          owner,
          title: owner
            ? `${person.name || "Unknown"} (owner)`
            : person.name || "Unknown participant",
        });
      }

      function initials(name) {
        return (
          String(name || "?")
            .trim()
            .split(/\s+/)
            .slice(0, 2)
            .map((part) => part[0]?.toUpperCase() || "")
            .join("") || "?"
        );
      }

      function cssUrl(value) {
        return String(value || "").replace(/["\\]/g, "\\$&");
      }

      function personFor(id) {
        return (
          (state.people || []).find((person) => person.id === id) || {
            id,
            name: id ? id.slice(0, 8) : "",
            picture: "",
          }
        );
      }

      function pickerCandidates() {
        // Not board-scoped (unlike initiative.html's picker) - Overview spans
        // every board and has no per-board peer topic here, so this offers
        // every peer the session knows about instead.
        const known = state.people || [];
        const already = modalParticipants
          .filter((id) => !known.some((person) => person.id === id))
          .map((id) => personFor(id));
        return [...known, ...already];
      }

      function renderUserPicker() {
        const container = el("participantPicker");
        container.replaceChildren();
        for (const person of pickerCandidates()) {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = modalReadOnlyPerspective;
          button.className = "user-choice";
          if (modalParticipants.includes(person.id)) button.classList.add("selected");
          const avatar = SovereignUI.avatar(person, {
            className: "participant-avatar",
          });
          const name = document.createElement("span");
          name.textContent = person.name;
          button.append(avatar, name);
          button.onclick = () => {
            const index = modalParticipants.indexOf(person.id);
            if (index >= 0) {
              modalParticipants.splice(index, 1);
              if (modalOwner === person.id) modalOwner = null;
            } else if (person.id) {
              modalParticipants.push(person.id);
            }
            renderUserPicker();
            renderOwnerSelect();
          };
          container.append(button);
        }
      }

      function renderOwnerSelect() {
        const select = el("cardOwner");
        select.replaceChildren();
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "Unassigned";
        select.append(blank);
        for (const id of modalParticipants) {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = personFor(id).name;
          select.append(option);
        }
        select.value = modalParticipants.includes(modalOwner) ? modalOwner : "";
        modalOwner = select.value || null;
        select.disabled = modalReadOnlyPerspective;
      }

      function setExpanded(board, expanded) {
        return submitMutation({
          key: `expanded:${board.uuid}`,
          command: "set-board-expanded",
          arguments: { uuid: board.uuid, expanded },
          action: (request) =>
            request("/api/cockpit/boards/settings", { board_uuid: board.uuid, expanded }),
          successMessage: expanded ? "Expanded" : "Collapsed",
          project: (draft, change) => {
            const target = (draft.boards || []).find((entry) => entry.uuid === change.uuid);
            if (target) target.expanded = change.expanded;
            return draft;
          },
        });
      }

      function openBoardSettings(board) {
        settingsBoard = board;
        el("boardSettingsTitle").textContent = board.name;
        const fields = el("boardSettingsFields");
        fields.replaceChildren();
        fields.append(
          selectField(
            "settingsActiveColumn",
            "Active column",
            board.columns,
            board.active_column_uuid || "",
          ),
          selectField(
            "settingsNextColumn",
            "Next column",
            board.columns,
            board.next_column_uuid || "",
          ),
        );
        const active = el("settingsActiveColumn");
        const next = el("settingsNextColumn");
        active.onchange = () => {
          if (active.value && active.value === next.value) next.value = "";
        };
        next.onchange = () => {
          if (next.value && next.value === active.value) active.value = "";
        };
        el("boardSettingsModal").showModal();
      }

      function openAgreementSettings(agreement) {
        settingsAgreement = agreement;
        el("agreementSettingsTitle").textContent = agreement.title || "Untitled team";
        el("agreementSettingsModal").showModal();
      }

      function selectField(id, text, columns, value) {
        const label = document.createElement("label");
        label.textContent = text;
        const select = document.createElement("select");
        select.id = id;
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "None";
        select.append(empty);
        for (const column of columns) {
          const option = document.createElement("option");
          option.value = column.uuid;
          option.textContent = column.name;
          select.append(option);
        }
        select.value = value;
        label.append(select);
        return label;
      }

      el("cancelBoardSettingsBtn").onclick = () => el("boardSettingsModal").close();
      el("deleteBoardSettingsBtn").onclick = () => {
        const board = settingsBoard;
        if (!board) return;
        confirmAction(
          "Delete this initiative?",
          "This removes the initiative and all of its cards. This cannot be undone.",
          () => {
            el("boardSettingsModal").close();
            return run(
              (request) =>
                request("/api/cockpit/kanban/boards/delete", {
                  board_uuid: board.uuid,
                }),
              "Initiative deleted",
            );
          },
        );
      };
      el("cancelAgreementSettingsBtn").onclick = () => el("agreementSettingsModal").close();
      el("deleteAgreementBtn").onclick = () => {
        const agreement = settingsAgreement;
        if (!agreement) return;
        confirmAction(
          "Delete this team?",
          "This removes the team and all of its sections and clauses, " +
            "and stops sharing it. This cannot be undone.",
          () => {
            el("agreementSettingsModal").close();
            return run(
              (request) =>
                request("/api/cockpit/agreement/agreements/delete", {
                  agreement_uuid: agreement.uuid,
                }),
              "Team deleted",
            );
          },
        );
      };
      el("saveBoardSettingsBtn").onclick = () => {
        const board = settingsBoard;
        el("boardSettingsModal").close();
        run(
          (request) =>
            request("/api/cockpit/boards/settings", {
              board_uuid: board.uuid,
              active_column_uuid: el("settingsActiveColumn").value,
              next_column_uuid: el("settingsNextColumn").value,
            }),
          "Settings saved",
        );
      };

      function openCardModal(card) {
        modalCard = card;
        modalPerspectiveKey = null;
        modalPerspectiveOptions = cardPerspectiveOptions(card);
        modalLocalDraft = {
          name: card.name || "",
          description: card.description || "",
          participants: Array.isArray(card.participants) ? [...card.participants] : [],
          owner: card.owner || null,
        };
        renderCardPerspective("local");
        el("cardOwner").onchange = () => {
          modalOwner = el("cardOwner").value || null;
        };
        el("cardModal").showModal();
      }

      function cardPerspectiveOptions(card) {
        const options = [
          {
            key: "local",
            label: "Mine",
            version: card,
            absent: false,
          },
        ];
        const events = card.transition?.events || (card.transition ? [card.transition] : []);
        for (const [index, version] of (card.perspectives || []).entries()) {
          const event = events.find((candidate) => {
            const revision = candidate.peer_revision || candidate.peer_state_hash;
            return revision
              ? revision === version.revision
              : candidate.peer_addr === version.peer_addr;
          });
          options.push({
            key: `peer:${index}`,
            label: event ? transitionActorLabel(event) : peerLabel(version.peer_addr),
            version,
            absent: version.absent,
          });
        }
        return options;
      }

      function captureLocalCardDraft() {
        if (modalPerspectiveKey !== "local") return;
        modalLocalDraft = {
          name: el("cardName").value,
          description: el("cardDescription").value,
          participants: [...modalParticipants],
          owner: modalOwner,
        };
      }

      function renderCardPerspective(key) {
        captureLocalCardDraft();
        modalPerspectiveKey = key;
        const perspective = modalPerspectiveOptions.find((item) => item.key === key);
        const isLocal = !perspective || perspective.key === "local";
        modalReadOnlyPerspective = !isLocal;
        const data = isLocal
          ? modalLocalDraft
          : perspective.absent
            ? { name: "", description: "", participants: [], owner: null }
            : perspective.version;
        el("cardModalTitle").textContent = isLocal
          ? "Edit Card — My Perspective"
          : `Card — ${perspective.label}'s Perspective`;
        el("cardName").value = data?.name || "";
        el("cardDescription").value = data?.description || "";
        el("cardName").disabled = modalReadOnlyPerspective || perspective?.absent;
        el("cardDescription").disabled = modalReadOnlyPerspective || perspective?.absent;
        modalParticipants = Array.isArray(data?.participants) ? [...data.participants] : [];
        modalOwner = data?.owner || null;
        renderUserPicker();
        renderOwnerSelect();
        el("cardPerspectiveMeta").textContent = perspective?.absent
          ? `This card is absent from ${perspective.label}'s perspective.`
          : `Column: ${isLocal ? modalCard.column_name : perspective.version.column_name || "Unknown column"}`;
        el("saveCardBtn").style.display = isLocal ? "" : "none";
        el("deleteCardBtn").style.display = isLocal ? "" : "none";
        renderCardPerspectiveSwitcher();
      }

      function renderCardPerspectiveSwitcher() {
        const switcher = el("cardPerspectiveSwitcher");
        switcher.replaceChildren();
        switcher.style.display = modalPerspectiveOptions.length > 1 ? "flex" : "none";
        for (const perspective of modalPerspectiveOptions) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = perspective.label;
          button.className = "perspective-option";
          if (perspective.key === modalPerspectiveKey) button.classList.add("active");
          button.onclick = () => renderCardPerspective(perspective.key);
          switcher.append(button);
        }
      }

      el("cancelCardBtn").onclick = () => el("cardModal").close();
      el("deleteCardBtn").onclick = () => {
        const card = modalCard;
        if (!card) return;
        confirmAction("Delete card?", "This removes the card from its initiative.", () => {
          el("cardModal").close();
          return run(
            (request) =>
              request("/api/cockpit/kanban/cards/delete", { card_uuid: card.uuid }),
            "Card deleted",
          );
        });
      };
      el("cardForm").addEventListener("submit", (event) => {
        event.preventDefault();
        if (modalReadOnlyPerspective) return;
        const card = modalCard;
        el("cardModal").close();
        run(
          (request) =>
            request("/api/cockpit/kanban/cards/update", {
              card_uuid: card.uuid,
              name: el("cardName").value,
              description: el("cardDescription").value,
              participants: dedupe(modalParticipants),
              owner: modalOwner || null,
            }),
          "Card updated",
        );
      });

      const addNew = el("cockpitHeaderControls").content.querySelector(".bob-add-new");

      SovereignShell.mount({
        container: el("shell"),
        applicationId: "cockpit",
        topicUuid: () => state?.selected_topic?.uuid || "",
        state: () => state || {},
        agendaRoutes: () => {
          const app = state?.selected_topic?.application_id;
          if (app === "team") {
            return {
              topicKey: "agreement_uuid",
              create: "/api/cockpit/agreement/agenda/create",
              delete: "/api/cockpit/agreement/agenda/delete",
              setPriority: "/api/cockpit/agreement/agenda/set_priority",
              move: "/api/cockpit/agreement/agenda/move",
            };
          }
          if (app === "initiative") {
            return {
              topicKey: "board_uuid",
              create: "/api/cockpit/kanban/agenda/create",
              delete: "/api/cockpit/kanban/agenda/delete",
              setPriority: "/api/cockpit/kanban/agenda/set_priority",
              move: "/api/cockpit/kanban/agenda/move",
            };
          }
          if (app === "flow") {
            return {
              topicKey: "process_uuid",
              create: "/api/cockpit/flow/agenda/create",
              delete: "/api/cockpit/flow/agenda/delete",
              setPriority: "/api/cockpit/flow/agenda/set_priority",
              move: "/api/cockpit/flow/agenda/move",
            };
          }
          return null;
        },
        autoAdoptRoute: () =>
          state?.selected_topic?.application_id === "initiative"
            ? { path: "/api/cockpit/kanban/auto_adopt", topicKey: "board_uuid" }
            : null,
        autoAdoptLabels: AUTO_ADOPT_LABELS,
        autoAdoptDescriptions: AUTO_ADOPT_DESCRIPTIONS,
        sessionView,
        onChanged: () => load(),
      });
      SovereignShell.setAppActions(addNew);

      // "+ Add new" drops a menu of the topic-creating applications this host
      // actually has - the cockpit routes to each application's create flow
      // rather than creating anything itself. The board flow keeps its
      // template modal; a new agreement appears as a tile, and you stay here
      // to keep adding, exactly as creating a board leaves you here.
      function openNewBoardModal() {
        el("newBoardName").value = "Untitled initiative";
        const select = el("newBoardTemplate");
        select.replaceChildren();
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Start empty";
        select.append(empty);
        for (const board of state.boards || []) {
          const opt = document.createElement("option");
          opt.value = board.uuid;
          opt.textContent = board.name;
          select.append(opt);
        }
        el("newBoardModal").showModal();
      }

      // Copying an agreement is choosing where a new one starts, so it lives
      // in the flow that makes one - the same modal shape a new board uses.
      // An agreement copied this way arrives with the text and the roles and
      // nobody in it, which is what a template is.
      function openNewAgreementModal() {
        el("newAgreementName").value = "Untitled team";
        const select = el("newAgreementTemplate");
        select.replaceChildren();
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Start empty";
        select.append(empty);
        for (const agreement of state.agreements || []) {
          const opt = document.createElement("option");
          opt.value = agreement.uuid;
          opt.textContent = agreement.title || "Untitled team";
          select.append(opt);
        }
        el("newAgreementModal").showModal();
      }

      function createFlow() {
        return run(
          (request) =>
            request("/api/cockpit/flow/processes/create", {
              title: "Untitled flow",
              definition_id: "integrative-election",
              definition_version: "0.2.0",
            }),
          "Flow created",
        );
      }

      function closeAddNewMenu() {
        el("addNewMenu").hidden = true;
      }

      el("addNewBtn").onclick = (event) => {
        event.stopPropagation();
        const menu = el("addNewMenu");
        if (!menu.hidden) {
          closeAddNewMenu();
          return;
        }
        menu.replaceChildren();
        for (const item of state.creatable || []) {
          const choice = document.createElement("button");
          choice.type = "button";
          choice.textContent = item.label;
          choice.onclick = () => {
            closeAddNewMenu();
            if (item.application_id === "team") openNewAgreementModal();
            else if (item.application_id === "flow") createFlow();
            else openNewBoardModal();
          };
          menu.append(choice);
        }
        menu.hidden = false;
        setTimeout(() => {
          document.addEventListener("click", closeAddNewMenu, { once: true });
        }, 0);
      };

      el("cancelNewBoardBtn").onclick = () => el("newBoardModal").close();
      el("newBoardForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = el("newBoardName").value || "Kanban Board";
        const templateUuid = el("newBoardTemplate").value;
        el("newBoardModal").close();
        run(async (request) => {
          if (templateUuid) {
            const result = await request(
              "/api/cockpit/kanban/boards/copy",
              { board_uuid: templateUuid },
              "copy",
            );
            if (result.value) {
              await request(
                "/api/cockpit/kanban/boards/rename",
                { board_uuid: result.value, name },
                "rename",
              );
            }
            return result;
          }
          return request("/api/cockpit/kanban/boards/create", { name });
        }, "Initiative created");
      });

      el("cancelNewAgreementBtn").onclick = () => el("newAgreementModal").close();
      el("newAgreementForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const title = el("newAgreementName").value || "Untitled team";
        const templateUuid = el("newAgreementTemplate").value;
        el("newAgreementModal").close();
        // One request either way: clone takes the title, so unlike a board
        // copy there is nothing to rename afterwards.
        run(
          (request) =>
            templateUuid
              ? request("/api/cockpit/agreement/agreements/clone", {
                  agreement_uuid: templateUuid,
                  title,
                })
              : request("/api/cockpit/agreement/agreements/create", {
                  title,
                }),
          "Team created",
        );
      });

      // The shell's pane always shares the selected topic, so sharing any
      // tile means selecting it first. Every rendered tile is a Core topic,
      // so one function serves all source applications.
      async function openShareModal(topic) {
        if (state.selected_topic?.uuid !== topic.uuid) {
          await selectTopic(topic);
        }
        await SovereignShell.openConnectionPanel();
      }

      async function openShareModalFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const topicUuid = params.get("share");
        if (!topicUuid) return;
        const topic = [
          ...(state.boards || []),
          ...(state.agreements || []),
          ...(state.processes || []),
        ].find((entry) => entry.uuid === topicUuid);
        if (topic) await openShareModal(topic);
        params.delete("share");
        const query = params.toString();
        window.history.replaceState({}, "", window.location.pathname + (query ? `?${query}` : ""));
      }

      load()
        .then(openShareModalFromUrl)
        .catch((err) => showToast(err.message, true));

      function isEditingBoards() {
        // Refreshing rebuilds #boards from scratch, which would yank focus
        // out from under an in-progress edit (objective text, card fields,
        // the status dropdown) - skip the poll while one of those is
        // focused rather than fighting the user's cursor.
        const active = document.activeElement;
        if (!active || !el("boards").contains(active)) return false;
        return active.isContentEditable || ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName);
      }
      sessionView.startPolling({
        views: ["tiles", "context"],
        intervalMs: 1500,
        when: () => !isEditingBoards(),
      });
      // Presence can age without changing application data. Refresh only the
      // selected topic's collaboration fragment, never every tile.
      setInterval(() => {
        if (!isEditingBoards()) {
          sessionView.refresh("context").catch((error) => showToast(error.message, true));
        }
      }, 3000);
    </script>
  </body>
</html>
