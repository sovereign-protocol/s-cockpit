name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy: {matrix: {python: ["3.10", "3.14"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      # Without S-Initiative present. A5 says the Cockpit must start with reduced
      # function rather than fail, so this run has to stay green on its own.
      - run: python -m pytest -q

  with-initiative:
    # The run above skips every facade test, because they need the optional
    # producer. Twenty-two of twenty-three tests were skipping, so CI was
    # green while exercising almost nothing. This job installs S-Initiative and
    # fails if anything still skips.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: python -m pip install ".[test-initiative]"
      - run: python -m pip check
      - name: Run the suite with the optional producer installed
        shell: pwsh
        run: |
          $output = python -m pytest -q 2>&1 | Out-String
          $failed = $LASTEXITCODE -ne 0
          $output
          if ($failed) { throw "pytest failed" }
          if ($output -match "(\d+) skipped") {
            throw "still skipping with S-Initiative installed: $($Matches[0])"
          }
